apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tiltak-refusjon-api-labs
  namespace: arbeidsgiver
  labels:
    team: arbeidsgiver
spec:
  env:
    - name: MILJO
      value: dev-gcp-labs
    - name: FAKE_LOGIN_URI
      value: http://tiltak-fakelogin
    - name: LOG_LEVEL
      value: INFO
    - name: SERVER_PORT
      value: "8080"
    - name: TILTAK_PDFGEN_URI
      value: http://tiltak-pdfgen
    - name: WIREMOCK_SERVER_PORT
      value: "9090"
  image: {{image}}
  resources:
    limits:
      cpu: 1500m
  liveness:
    path: /internal/actuator/health
    initialDelay: 20
  readiness:
    path: /internal/actuator/health
    initialDelay: 20
  replicas:
    min: 1
    max: 1
  accessPolicy:
    inbound:
      rules:
        - application: tiltak-refusjon-saksbehandler-labs
        - application: tiltak-refusjon-arbeidsgiver-labs
        - application: tiltaksgjennomforing-api-labs
    outbound:
      external:
        - host: "g.nav.no"
      rules:
        - application: tiltak-fakelogin
        - application: tiltak-pdfgen
  observability:
    logging:
      destinations:
        - id: elastic
